<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Horizonte — observatório digital de divulgação científica sobre Física, Astrofísica, Astronomia e Cosmologia." />
    <meta name="theme-color" content="#05060A" />
    <link rel="preconnect" href="https://images-assets.nasa.gov" crossorigin />
    <title>Horizonte — Observatório de divulgação científica</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('horizonte:theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
